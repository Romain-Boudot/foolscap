[package]
name = "foolscap"
version = "0.1.0"
description = "Foolscap — minimalist, keyboard-first scratchpad, fast, ephemeral, cross-platform."
authors = ["Romain Boudot <boudotromain@gmail.com>"]
edition = "2021"

[lib]
name = "foolscap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# DwmSetWindowAttribute for forcing rounded corners on Win11 when
# `decorations: false` is used (otherwise the OS-managed material like
# Acrylic / Mica renders into a square window shape).
windows = { version = "0.61", features = [
    "Win32_Graphics_Dwm",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
